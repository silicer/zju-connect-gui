name: build-packages

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - 'refactor/*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  APP_NAME: zju-connect-gui

jobs:
  # ── Linux (x86_64 native + arm64 native) — static musl ──────────────
  # Fully static musl binaries: no glibc version dependency, so one
  # artifact runs on any Linux (musl libc is linked in, not loaded).
  # rustup's `rust-std` for `*-linux-musl` ships a self-contained musl
  # `libc.a` plus the crt objects, and each runner already has a native
  # `cc`, so no musl cross toolchain is required. (`libloading` passes
  # `-ldl`; libc6-dev's empty `libdl.a` compatibility archive satisfies
  # that, and the `dl*` symbols themselves come from musl's `libc.a`.)
  #
  # ProxyBridge is deliberately NOT bundled for Linux: upstream ships a
  # glibc shared library (`libproxybridge.so` → `NEEDED libc.so.6`) which
  # the app loads in-process via `dlopen`, and a fully static musl binary
  # has no dynamic loader at all — musl's `dlopen` is a stub that fails
  # with "Dynamic loading not supported", so the library could never be
  # loaded. Linking ProxyBridge into the binary statically is tracked
  # separately. `zju-connect` is unaffected: upstream ships it as an
  # already-static Go binary that is spawned as a child process, not
  # `dlopen`ed, so it needs no musl rebuild.
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      # A static musl binary must have no PT_INTERP program header (else it
      # needs a loader at run time) and no NEEDED entries. Static-PIE keeps
      # a dynamic section for its own relocations, so checking for the
      # interpreter alone is not enough.
      - name: Verify static linkage
        run: |
          BIN=target/${{ matrix.target }}/release/${{ env.APP_NAME }}
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::${{ env.APP_NAME }} is dynamically linked (has PT_INTERP)"
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::${{ env.APP_NAME }} has dynamic library dependencies"
            readelf -d "$BIN" | grep NEEDED
            exit 1
          fi
          echo "OK: ${{ env.APP_NAME }} is statically linked"

      - name: Package tarball
        run: |
          ARCH=${{ contains(matrix.target, 'aarch64') && 'arm64' || 'x86_64' }}
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} dist/
          tar -czf ${{ env.APP_NAME }}-linux-${ARCH}-musl.tar.gz -C dist .
          ls -lh ${{ env.APP_NAME }}-linux-${ARCH}-musl.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-linux-${{ contains(matrix.target, 'aarch64') && 'arm64' || 'x86_64' }}-musl
          path: ${{ env.APP_NAME }}-linux-*-musl.tar.gz
          if-no-files-found: error

  # ── Windows (x86_64 + arm64) ───────────────────────────────────────
  build-windows:
    name: Windows (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── ProxyBridge: bundle core lib + WinDivert driver (x86_64 only) ──
      # The app loads ProxyBridgeCore.dll from the bundled proxybridge/ dir
      # and auto-installs the signed WinDivert64.sys driver as a kernel
      # service when missing, so users never run an installer by hand.
      # All three files sit at the top level of the NSIS setup archive.
      # ARM64 is not bundled: no ARM64 WinDivert driver exists and the x64
      # core DLL cannot load in an arm64 process.
      - name: Install 7-Zip (x86_64 only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: choco install 7zip -y --no-progress

      - name: Download ProxyBridge (Windows x86_64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\proxybridge-dist
          $url = "https://github.com/InterceptSuite/ProxyBridge/releases/download/v4.0.0/ProxyBridge-Setup-4.0.0.exe"
          $tempExe = "$env:TEMP\pb-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $tempExe
          7z x $tempExe "-otarget\proxybridge-dist" -y | Out-Null
          # Keep only core library + WinDivert driver/dll; drop GUI/CLI/Skia
          Get-ChildItem target\proxybridge-dist | Where-Object { $_.Name -notin @('ProxyBridgeCore.dll','WinDivert.dll','WinDivert64.sys') } | Remove-Item -Recurse -Force
          Get-ChildItem target\proxybridge-dist

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: pwsh
        run: |
          $ARCH = if ('${{ matrix.target }}' -like '*aarch64*') { 'arm64' } else { 'x86_64' }
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\${{ matrix.target }}\release\${{ env.APP_NAME }}.exe dist\

          # Bundle ProxyBridge when available (x86_64 only)
          if (Test-Path target\proxybridge-dist\ProxyBridgeCore.dll) {
            New-Item -ItemType Directory -Force -Path dist\proxybridge
            Copy-Item target\proxybridge-dist\* dist\proxybridge\
            Write-Host "ProxyBridge bundled for Windows ${ARCH}"
          } else {
            Write-Host "ProxyBridge not bundled for Windows ${ARCH}"
          }

          # Create zip
          Compress-Archive -Path dist\* -DestinationPath ${{ env.APP_NAME }}-windows-${ARCH}.zip
          Get-ChildItem ${{ env.APP_NAME }}-windows-${ARCH}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-windows-${{ contains(matrix.target, 'aarch64') && 'arm64' || 'x86_64' }}
          path: ${{ env.APP_NAME }}-windows-*.zip
          if-no-files-found: error

  # ── macOS (arm64 only) ──────────────────────────────────────────────
  build-macos:
    name: macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # macOS: ProxyBridge integration is not supported (upstream ships no
      # reusable library/CLI for macOS) and is compiled out of the app.

      - name: cargo build --release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package tarball
        run: |
          mkdir dist
          cp target/aarch64-apple-darwin/release/${{ env.APP_NAME }} dist/
          tar -czf ${{ env.APP_NAME }}-macos-arm64.tar.gz -C dist .
          ls -lh ${{ env.APP_NAME }}-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-macos-arm64
          path: ${{ env.APP_NAME }}-macos-*.tar.gz
          if-no-files-found: error
