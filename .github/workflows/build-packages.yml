name: build-packages

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - 'refactor/*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  APP_NAME: zju-connect-gui

jobs:
  # ── Linux (x86_64 native + arm64 native) — static musl ──────────────
  # Fully static musl binaries: no glibc version dependency, so one
  # artifact runs on any Linux (musl libc is linked in, not loaded).
  # rustup's `rust-std` for `*-linux-musl` ships a self-contained musl
  # `libc.a` plus the crt objects, so the build needs no musl *cross*
  # toolchain on these native runners.
  #
  # `build.rs` compiles `vendor/` — ProxyBridge plus its netfilter stack —
  # into the binary rather than `dlopen`ing upstream's `libproxybridge.so`:
  # a fully static musl binary has no dynamic loader at all (musl's `dlopen`
  # is a stub that fails with "Dynamic loading not supported"), so a shared
  # library could never be loaded there.
  #
  # That C must be compiled against musl: the default `cc` emits glibc-only
  # references such as `__ctype_b_loc`, which musl does not provide, and the
  # final link then fails. Hence `musl-gcc` from `musl-tools`.
  #
  # `libnetfilter_queue` and `libnfnetlink` are GPL-2.0 and `libmnl` is
  # LGPL-2.1, all linked in statically, so the Linux binary as a whole is
  # GPL-2.0. Their license texts are shipped inside the tarball; see
  # vendor/README.md for provenance.
  #
  # `zju-connect` is unaffected: upstream ships it as an already-static Go
  # binary that is spawned as a child process, not `dlopen`ed, so it needs
  # no musl rebuild.
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            cc: musl-gcc
            arch: x86_64
            core: zju-connect-linux-amd64.zip
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cc: musl-gcc
            arch: arm64
            core: zju-connect-linux-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl C toolchain
        run: |
          sudo apt-get update -y
          # musl-tools provides musl-gcc. linux-libc-dev provides the kernel UAPI
          # headers (<linux/*.h>, <asm/*.h>) that the vendored netfilter sources
          # include and that musl itself does not ship; build.rs puts them on
          # musl-gcc's include path, which its specs file otherwise excludes.
          sudo apt-get install -y musl-tools linux-libc-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Point the vendored C compiler at musl. Without this, `cc` (glibc)
      # produces objects that cannot link into a musl binary.
      - name: cargo build --release
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.cc }}
        run: cargo build --release --target ${{ matrix.target }}

      # A static musl binary must have no PT_INTERP program header (else it
      # needs a loader at run time) and no NEEDED entries. Static-PIE keeps
      # a dynamic section for its own relocations, so checking for the
      # interpreter alone is not enough.
      - name: Verify static linkage
        run: |
          BIN=target/${{ matrix.target }}/release/${{ env.APP_NAME }}
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::${{ env.APP_NAME }} is dynamically linked (has PT_INTERP)"
            exit 1
          fi
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::${{ env.APP_NAME }} has dynamic library dependencies"
            readelf -d "$BIN" | grep NEEDED
            exit 1
          fi
          echo "OK: ${{ env.APP_NAME }} is statically linked"

      - name: Download zju-connect core
        env:
          ASSET: ${{ matrix.core }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The GUI launches `<app_dir>/bin/zju-connect`, so ship the core next to
          # it, ready to run. Resolve the tag first (authenticated, so no API rate
          # limit) and download *by tag* rather than via `latest/download`, so the
          # version reported in the log is the one actually packaged.
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Mythologyli/zju-connect/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          test -n "$tag" || { echo "::error::cannot resolve the zju-connect release tag"; exit 1; }
          echo "zju-connect core: $tag ($ASSET)"
          curl -fsSL -o core.zip \
            "https://github.com/Mythologyli/zju-connect/releases/download/$tag/$ASSET"
          unzip -o -q core.zip -d core
          rm -f core.zip
          chmod +x core/zju-connect

      - name: Package tarball
        run: |
          # Layout: the GUI at the root, the core in `bin/` -- the path the app
          # launches. See "Release packages" in README.md.
          mkdir -p dist/bin
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} dist/
          install -m 0755 core/zju-connect dist/bin/zju-connect

          tar -czf ${{ env.APP_NAME }}-linux-${{ matrix.arch }}-musl.tar.gz -C dist .
          ls -lh ${{ env.APP_NAME }}-linux-${{ matrix.arch }}-musl.tar.gz

      # `archive: false` uploads the tarball as-is rather than zipping it again.
      # That is also a correctness matter: a zipped artifact loses file modes,
      # and both binaries in here are meant to be executable. With this option
      # the artifact is named after the file, so `name:` would be ignored.
      # Caveat: `gh run download` assumes every artifact is a zip and fails on
      # these ("not a valid zip file"); use the web UI, or
      # `gh api .../actions/artifacts/<id>/zip`, which returns the raw file.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APP_NAME }}-linux-${{ matrix.arch }}-musl.tar.gz
          archive: false
          if-no-files-found: error

  # ── Windows (x86_64 + arm64) ───────────────────────────────────────
  build-windows:
    name: Windows (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            arch: x86_64
            core: zju-connect-windows-amd64.zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            core: zju-connect-windows-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── ProxyBridge: compile the vendored core in, bundle WinDivert ────
      # ProxyBridge itself is compiled into the exe by build.rs (the vendored
      # source in vendor/proxybridge-win-4.0.0/, carrying our DNS patch), so
      # only WinDivert is shipped: the user-mode WinDivert.dll plus the signed
      # WinDivert64.sys driver, which the app installs as a kernel service when
      # missing so users never run an installer by hand. Both files sit at the
      # top level of the NSIS setup archive.
      # ARM64 is not bundled: no ARM64 WinDivert driver exists, so the
      # ProxyBridge integration is stubbed out for that target entirely.
      - name: Install 7-Zip (x86_64 only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: choco install 7zip -y --no-progress

      - name: Download WinDivert (Windows x86_64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\proxybridge-dist
          $url = "https://github.com/InterceptSuite/ProxyBridge/releases/download/v4.0.0/ProxyBridge-Setup-4.0.0.exe"
          $tempExe = "$env:TEMP\pb-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $tempExe
          7z x $tempExe "-otarget\proxybridge-dist" -y | Out-Null
          # Keep only the WinDivert pieces; drop GUI/CLI/Skia and the upstream
          # ProxyBridgeCore.dll, which this build no longer uses.
          Get-ChildItem target\proxybridge-dist | Where-Object { $_.Name -notin @('WinDivert.dll','WinDivert64.sys') } | Remove-Item -Recurse -Force
          Get-ChildItem target\proxybridge-dist

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Download zju-connect core
        shell: pwsh
        env:
          ASSET: ${{ matrix.core }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The GUI launches `<app_dir>\bin\zju-connect.exe`, so ship the core
          # next to it, ready to run. Resolve the tag first (authenticated, so no
          # API rate limit) and download *by tag* rather than via
          # `latest/download`, so the version reported in the log is the one
          # actually packaged.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $tag = (Invoke-RestMethod -Uri 'https://api.github.com/repos/Mythologyli/zju-connect/releases/latest' -Headers $headers).tag_name
          if (-not $tag) { Write-Error 'cannot resolve the zju-connect release tag'; exit 1 }
          Write-Host "zju-connect core: $tag ($env:ASSET)"
          Invoke-WebRequest -Uri "https://github.com/Mythologyli/zju-connect/releases/download/$tag/$env:ASSET" -OutFile core.zip
          Expand-Archive -Path core.zip -DestinationPath core -Force
          Remove-Item core.zip

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist\bin | Out-Null
          Copy-Item target\${{ matrix.target }}\release\${{ env.APP_NAME }}.exe dist\
          Copy-Item core\zju-connect.exe dist\bin\zju-connect.exe

          # Bundle WinDivert when available (x86_64 only). ProxyBridge itself is
          # inside the exe — build.rs compiles the vendored source in.
          if (Test-Path target\proxybridge-dist\WinDivert.dll) {
            New-Item -ItemType Directory -Force -Path dist\proxybridge | Out-Null
            Copy-Item target\proxybridge-dist\* dist\proxybridge\
            Write-Host "WinDivert bundled for Windows ${{ matrix.arch }}"
          } else {
            Write-Host "WinDivert not bundled for Windows ${{ matrix.arch }}"
          }

          Get-ChildItem -Recurse dist | Select-Object -ExpandProperty FullName

      # `upload-artifact` zips `dist` once. Pre-zipping it here (as this job used
      # to) would nest a second archive inside the artifact.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-windows-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  # ── macOS (arm64 only) ──────────────────────────────────────────────
  build-macos:
    name: macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # macOS: ProxyBridge integration is not supported (upstream ships no
      # reusable library/CLI for macOS) and is compiled out of the app.

      - name: cargo build --release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Download zju-connect core
        env:
          ASSET: zju-connect-darwin-arm64.zip
          GH_TOKEN: ${{ github.token }}
        run: |
          # The GUI launches `<app_dir>/bin/zju-connect`, so ship the core next to
          # it, ready to run. Resolve the tag first (authenticated, so no API rate
          # limit) and download *by tag* rather than via `latest/download`, so the
          # version reported in the log is the one actually packaged.
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Mythologyli/zju-connect/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          test -n "$tag" || { echo "::error::cannot resolve the zju-connect release tag"; exit 1; }
          echo "zju-connect core: $tag ($ASSET)"
          curl -fsSL -o core.zip \
            "https://github.com/Mythologyli/zju-connect/releases/download/$tag/$ASSET"
          unzip -o -q core.zip -d core
          rm -f core.zip
          chmod +x core/zju-connect

      - name: Package tarball
        run: |
          mkdir -p dist/bin
          cp target/aarch64-apple-darwin/release/${{ env.APP_NAME }} dist/
          install -m 0755 core/zju-connect dist/bin/zju-connect

          tar -czf ${{ env.APP_NAME }}-macos-arm64.tar.gz -C dist .
          ls -lh ${{ env.APP_NAME }}-macos-arm64.tar.gz

      # `archive: false` uploads the tarball as-is rather than zipping it again.
      # That is also a correctness matter: a zipped artifact loses file modes,
      # and both binaries in here are meant to be executable. With this option
      # the artifact is named after the file, so `name:` would be ignored.
      # Caveat: `gh run download` assumes every artifact is a zip and fails on
      # these ("not a valid zip file"); use the web UI, or
      # `gh api .../actions/artifacts/<id>/zip`, which returns the raw file.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APP_NAME }}-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error
