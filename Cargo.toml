[package]
name = "zju-connect-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native desktop GUI for zju-connect"
license = "MIT"
publish = false

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
