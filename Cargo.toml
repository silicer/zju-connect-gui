[package]
name = "zju-connect-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native desktop GUI for zju-connect"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs", "signal"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }
base64 = "0.22"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }



[profile.release]
strip = "symbols"
# thin LTO trips an LLVM 22 bitcode bug under rustc 1.95 ("Missing element
# type for old-style global"). Re-enable once we move past that toolchain.
lto = false
codegen-units = 1
