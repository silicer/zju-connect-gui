[package]
name = "zju-connect-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native desktop GUI for zju-connect"
license = "MIT"
publish = false

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs"] }
log = "0.4"
base64 = "0.22"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[build-dependencies]
slint-build = "1"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
